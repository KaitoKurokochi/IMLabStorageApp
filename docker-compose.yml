services:
  mongodb:
    image: mongo:7.0
    container_name: imlab-storage-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: imlab-storage-backend
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - HOST=0.0.0.0
      - PORT=8000
      - MONGODB_URL=mongodb://mongodb:27017
      - DATABASE_NAME=imlab_storage
      - CORS_ORIGINS=*
      - UPLOAD_DIR=static/uploads
    volumes:
      - backend_uploads:/app/static/uploads
    ports:
      - "8000:8000"
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: imlab-storage-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongodb_data:
  backend_uploads:

