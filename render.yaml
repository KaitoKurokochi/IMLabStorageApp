services:
  - type: web
    name: imlab-storage-app
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_NAME
        value: imlab_storage
      - key: MONGODB_URL
        sync: false # Set this in Render Dashboard with your MongoDB Atlas URI
      - key: CORS_ORIGINS
        value: "*"
